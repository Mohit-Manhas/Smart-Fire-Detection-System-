<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIoT Fire Fighting Robot</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: #17212b; color: #f5f5f5; min-height: 100vh; }
    header { background: #d64531; padding: 20px; text-align: center; font-size: 28px; font-weight: 700; color: #fff; }
    .container { padding: 20px; }
    .top-section { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 24px; }
    .video-feed { width: min(720px, 100%); aspect-ratio: 3 / 2; overflow: hidden; background-color: #000; border: 1px solid #34495e; }
    .video-feed img { width: 100%; height: 100%; object-fit: cover; }
    .right-panel { display: flex; flex-direction: column; gap: 16px; width: min(320px, 100%); }
    .panel { background: #22303d; border: 1px solid #34495e; padding: 18px; border-radius: 8px; }
    .stats-panel div { margin: 10px 0; font-size: 18px; display: flex; justify-content: space-between; gap: 16px; }
    .mode-toggle { text-align: center; }
    button { border: 0; cursor: pointer; color: white; background: #2f80ed; border-radius: 6px; }
    .mode-toggle button { padding: 12px 24px; font-size: 16px; }
    .controls.manual, .controls.auto { display: none; flex-direction: column; align-items: center; gap: 20px; }
    .controls.manual.active, .controls.auto.active { display: flex; }
    .arrows { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .arrows button { width: 58px; height: 58px; margin: 4px; font-size: 22px; background: #111827; color: #62d6c6; }
    .servo-sliders { display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .servo-sliders input[type=range] { width: 180px; }
    .pump-button button { padding: 14px 28px; font-size: 17px; background: #2fa66a; }
    .status-message { font-size: 18px; color: #f7c948; text-align: center; }
  </style>
</head>
<body>
  <header>AIoT Fire Fighting Robot</header>
  <main class="container">
    <section class="top-section">
      <div class="video-feed">
        <img src="/video_feed" alt="Live camera feed" />
      </div>
      <div class="right-panel">
        <div class="panel stats-panel">
          <div>Temperature <span id="temp">-- C</span></div>
          <div>Humidity <span id="humidity">-- %</span></div>
        </div>
        <div class="panel mode-toggle">
          <button onclick="toggleMode()">Mode: <span id="currentMode">Manual</span></button>
        </div>
        <div class="panel controls manual active">
          <div class="arrows">
            <button onclick="moveRobot('forward')" aria-label="Move forward">↑</button>
            <div>
              <button onclick="moveRobot('left')" aria-label="Move left">←</button>
              <button onclick="moveRobot('stop')" aria-label="Stop">■</button>
              <button onclick="moveRobot('right')" aria-label="Move right">→</button>
            </div>
            <button onclick="moveRobot('back')" aria-label="Move backward">↓</button>
          </div>
          <div class="servo-sliders">
            <label>Pan<br><input type="range" min="0" max="180" onchange="servoControl('pan', this.value)" /></label>
            <label>Tilt<br><input type="range" min="0" max="180" onchange="servoControl('tilt', this.value)" /></label>
          </div>
          <div class="pump-button">
            <button onclick="activatePump()">Activate Pump</button>
          </div>
        </div>
        <div class="panel controls auto">
          <div class="status-message" id="autoStatus">Scanning...</div>
        </div>
      </div>
    </section>
  </main>
  <script>
    let isManual = true;
    function toggleMode() {
      isManual = !isManual;
      document.getElementById("currentMode").textContent = isManual ? "Manual" : "Auto";
      setMode(isManual ? "manual" : "auto");
      document.querySelector(".controls.manual").classList.toggle("active", isManual);
      document.querySelector(".controls.auto").classList.toggle("active", !isManual);
    }
    function moveRobot(direction) {
      fetch(`/move?direction=${direction}`).then(res => res.json()).then(data => console.log(data.status));
    }
    function servoControl(axis, value) {
      fetch(`/servo?axis=${axis}&value=${value}`).then(res => res.json()).then(data => console.log(data.status));
    }
    function activatePump() {
      fetch("/pump?state=on").then(res => res.json()).then(data => {
        console.log(data.status);
        setTimeout(() => fetch("/pump?state=off").then(res => res.json()).then(data => console.log(data.status)), 3000);
      });
    }
    function setMode(mode) {
      fetch(`/mode?value=${mode}`).then(res => res.json()).then(() => {
        if (mode === "auto") document.getElementById("autoStatus").textContent = "Fire detection mode active";
      });
    }
    setInterval(() => {
      fetch("/sensor").then(res => res.json()).then(data => {
        document.getElementById("temp").textContent = data.temp + " C";
        document.getElementById("humidity").textContent = data.humidity + " %";
        if (!isManual && data.fireDetected) document.getElementById("autoStatus").textContent = "Fire detected";
      });
    }, 2000);
  </script>
</body>
</html>
